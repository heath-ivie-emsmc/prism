name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pins:
    name: Actions are pinned
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-action-pins.sh

  api:
    name: API build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore -c Release
      # The integration tests start PostgreSQL and Redis with Testcontainers. The hosted runner has Docker.
      - run: dotnet test --no-build -c Release

  web:
    name: SPA build and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The repository must be granted access to the @ems-management-consultants/ui package ("Manage Actions access" on the package).
      - run: npm ci --ignore-scripts
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx ng test --watch=false
      - run: npx ng build
      # Browser tests: layout at every size, WCAG 2.2 AA with axe, keyboard. Playwright starts the web app itself and mocks the API.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-report
          path: web/e2e-report
          retention-days: 7
